<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plumeria 22 — 公式コンパイラー最小画面</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color-scheme:light dark}
*{box-sizing:border-box}body{margin:0}header{padding:14px 20px;border-bottom:1px solid #9995}main{padding:16px;display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr));}section{min-width:0}textarea{width:100%;font:13px/1.6 ui-monospace,monospace;padding:12px;border:1px solid #888;border-radius:8px;resize:vertical}#source{height:360px}#output{height:165px}#diagnostics{white-space:pre-wrap;font:13px ui-monospace,monospace;max-height:130px;overflow:auto}iframe{display:block;border:1px solid #888;border-radius:8px;width:100%;min-height:360px;background:#fff}button{background:#166534;color:white;padding:9px 20px;border:0;border-radius:8px;cursor:pointer;margin-right:10px}button:disabled{opacity:.5}button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}#status{padding:5px 16px;min-height:1.8rem;font-size:14px}@media(max-width:760px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><strong>Plumeria 22 — 公式エンジンで編集・プレビュー</strong><div>公式出典: <a href="https://github.com/zss-labs/plumeria">zss-labs/plumeria</a>（MIT）</div></header>
<div id="status" role="status" aria-live="polite">公式コンパイルエンジンを準備しています…</div>
<main>
<section><label for="source"><strong>編集するソースコード</strong></label><textarea id="source" spellcheck="false">import * as css from '@plumeria/core';

const styles = css.create({
  addButton: {
    paddingInline: 28,
    paddingBlock: 12,
    color: '#ffffff',
    backgroundColor: '#166534',
    borderRadius: 12,
  },
});

export default function App() {
  return <button sx={styles.addButton}>追加する</button>;
}</textarea>
<div><button id="compile" disabled>コンパイルして表示</button><button id="reset" type="button">初期化</button></div>
<h3>検査結果</h3><pre id="diagnostics">未実行</pre>
<h3>JavaScriptへの変換結果</h3><textarea id="output" readonly aria-label="変換結果"></textarea></section>
<section><h3>実際のプレビュー</h3><iframe title="Plumeriaプレビュー" id="preview" src="/playground/preview/index.html"></iframe><h3>生成されたスタイル</h3><textarea id="generatedCss" readonly aria-label="生成されたスタイル" rows="6"></textarea></section>
</main>
<script type="module">
// machine_contract: offline built assets only, no official-site remote requests.
// state_transition: loading -> ready -> compiling -> rendered | failed.
const ENTRY='/playground.tsx';
const source=document.getElementById('source'), btn=document.getElementById('compile'), reset=document.getElementById('reset'), preview=document.getElementById('preview');
const status=document.getElementById('status'), diag=document.getElementById('diagnostics'), output=document.getElementById('output'), css=document.getElementById('generatedCss');
const initial=source.value;
let session=null, ready=false, applied=false;
const setStatus = message => status.textContent=message;
function render(){
  if(!session || !ready)return;
  setStatus('検査・コンパイル中…');
  try{
    const contents=source.value;
    session.update(ENTRY,contents);
    const errors=session.diagnostics(ENTRY).map(x=>`型検査: ${x.message}`);
    const lint=session.lint(ENTRY,contents,'off').filter(x=>x.severity>0).map(x=>`規則: ${x.message}`);
    diag.textContent=[...errors,...lint].join('\n')||'検査で問題は見つかりませんでした';
    const transpiled=session.transpile(ENTRY,contents);
    output.value=transpiled;
    preview.contentWindow.postMessage({type:'playground:render',files:{[ENTRY]:transpiled},sources:{[ENTRY]:contents},entry:ENTRY},location.origin);
    applied=true;
  }catch(error){setStatus('失敗: '+String(error));diag.textContent=String(error)}
}
window.addEventListener('message',event=>{
  if(event.origin!==location.origin || event.source!==preview.contentWindow)return;
  if(event.data?.type==='playground:ready'){ready=true;render();}
  if(event.data?.type==='playground:output'){css.value=event.data.css||'';}
  if(event.data?.type==='playground:rendered'){setStatus('公式コンパイラーによる画面更新が完了');}
});
btn.addEventListener('click',render);
reset.addEventListener('click',()=>{source.value=initial;render();});
(async()=>{
  try{
    const [engine,libResponse]=await Promise.all([import('/playground/engine.mjs'),fetch('/playground/libs.json')]);
    if(!libResponse.ok)throw new Error('型定義の読み込み失敗: '+libResponse.status);
    const libs=await libResponse.json();
    session=await engine.createSession({[ENTRY]:initial},libs);
    btn.disabled=false;
    setStatus('公式エンジンを読み込みました。プレビューの準備中…');
    if(ready)render();
  }catch(error){setStatus('公式エンジン読み込み失敗: '+String(error));diag.textContent=String(error);}
})();
</script>
</body></html>
