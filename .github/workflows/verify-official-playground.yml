name: Verify official Playground source

on:
  push:
    branches:
      - verify-official-playground-20261121

permissions:
  contents: read

jobs:
  build-playground:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROD_URL: https://plumeria.dev
    steps:
      - name: Checkout pinned upstream official Plumeria
        uses: actions/checkout@v6
        with:
          repository: zss-labs/plumeria
          ref: 70a0e7c23020ea1afb51999300471f50ece13c3f
          persist-credentials: false
      - name: Verify upstream commit identity
        run: test "$(git rev-parse HEAD)" = "70a0e7c23020ea1afb51999300471f50ece13c3f"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install exact upstream workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Plumeria workspace packages
        run: pnpm build
      - name: Build original browser compilation engine and preview
        run: pnpm --dir docs run prebuild
      - name: Verify original browser artifacts
        run: |
          set -euo pipefail
          test -s docs/public/playground/engine.mjs
          test -s docs/public/playground/libs.json
          test -s docs/public/playground/migrate-worker.mjs
          test -s docs/public/playground/migrate.wasm
          test -s docs/public/playground/preview/boot.mjs
          test -s docs/public/playground/preview/compiler.wasm32-wasi.wasm
          node -e "const fs=require('fs');const files=['docs/public/playground/engine.mjs','docs/public/playground/libs.json','docs/public/playground/migrate.wasm','docs/public/playground/preview/compiler.wasm32-wasi.wasm'];console.log(JSON.stringify({status:'engine_built',source:'zss-labs/plumeria',upstream:'70a0e7c23020ea1afb51999300471f50ece13c3f',files:files.map(path=>({path,bytes:fs.statSync(path).size}))},null,2))"
      - name: Build complete official website with Waku
        run: pnpm --dir docs run build
      - name: Confirm produced static website
        run: |
          set -euo pipefail
          test -d docs/dist/public
          find docs/dist/public -maxdepth 3 -type f -name "*playground*" -print -quit
          find docs/dist/public -maxdepth 3 -type f -name "index.html" -print -quit
      - name: Verify Chrome from GitHub-hosted runner
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Smoke test editor and actual preview
        run: |
          (cd docs && PORT=4173 pnpm start >/tmp/plumeria-official-server.log 2>&1) &
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({headless:true,channel:'chrome',args:['--no-sandbox']});
          const page = await browser.newPage({viewport:{width:1280,height:850}});
          page.on('console',msg=>{if(msg.type()==='error') console.error('browser:',msg.text());});
          let loaded=false;
          for (let attempt=0;attempt<30;attempt++){
            try {const response=await page.goto('http://127.0.0.1:4173/playground',{waitUntil:'domcontentloaded',timeout:8000});if(response?.ok()){loaded=true;break;}}
            catch{}
            await page.waitForTimeout(1000);
          }
          if(!loaded) throw new Error('site cannot serve /playground');
          await page.locator('[data-playground="stage"][data-ready="true"]').waitFor({timeout:120000});
          const stage=await page.locator('[data-playground="stage"]').getAttribute('data-ready');
          const preview=page.frameLocator('iframe[title="Preview"]');
          await preview.locator('body').waitFor({timeout:20000});
          const text=(await preview.locator('body').innerText()).trim();
          console.log(JSON.stringify({stage,previewCharacters:text.length,previewStart:text.slice(0,200)}));
          if(!text || /Export a component|cannot find|unsupported/i.test(text))throw new Error('preview did not render sample');
          await page.screenshot({path:'plumeria-official-playground-smoke.png'});
          await browser.close();
          JS
      - name: Upload official browser compiler and preview files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plumeria-official-22-playground-build
          path: |
            docs/public/playground/
            docs/dist/public/
            plumeria-official-playground-smoke.png
          if-no-files-found: warn
          retention-days: 2
