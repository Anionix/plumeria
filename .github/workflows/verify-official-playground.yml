name: Verify official Playground source

on:
  push:
    branches:
      - verify-official-playground-20261121

permissions:
  contents: read

jobs:
  build-playground:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROD_URL: https://plumeria.dev
    steps:
      - name: Checkout pinned upstream official Plumeria
        uses: actions/checkout@v6
        with:
          repository: zss-labs/plumeria
          ref: 70a0e7c23020ea1afb51999300471f50ece13c3f
          persist-credentials: false
      - name: Verify upstream commit identity
        run: test "$(git rev-parse HEAD)" = "70a0e7c23020ea1afb51999300471f50ece13c3f"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install exact upstream workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Plumeria workspace packages
        run: pnpm build
      - name: Build original browser compilation engine and preview
        run: pnpm --dir docs run prebuild
      - name: Verify original browser artifacts
        run: |
          set -euo pipefail
          test -s docs/public/playground/engine.mjs
          test -s docs/public/playground/libs.json
          test -s docs/public/playground/migrate-worker.mjs
          test -s docs/public/playground/migrate.wasm
          test -s docs/public/playground/preview/boot.mjs
          test -s docs/public/playground/preview/compiler.wasm32-wasi.wasm
          node -e "const fs=require('fs');const files=['docs/public/playground/engine.mjs','docs/public/playground/libs.json','docs/public/playground/migrate.wasm','docs/public/playground/preview/compiler.wasm32-wasi.wasm'];console.log(JSON.stringify({status:'engine_built',source:'zss-labs/plumeria',upstream:'70a0e7c23020ea1afb51999300471f50ece13c3f',files:files.map(path=>({path,bytes:fs.statSync(path).size}))},null,2))"
      - name: Build complete official website with Waku
        run: pnpm --dir docs run build
      - name: Confirm produced static website
        run: |
          set -euo pipefail
          test -d docs/dist/public
          find docs/dist/public -maxdepth 3 -type f -name "*playground*" -print -quit
          find docs/dist/public -maxdepth 3 -type f -name "index.html" -print -quit
      - name: Mount the exact local Node-only adapter under the built site
        run: |
          mkdir -p docs/dist/public/adapter
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/Anionix/plumeria/cf803a293e9eff3d6487fe180ae1e98efdfbca47/verification/playground-adapter/index.html" -o docs/dist/public/adapter/index.html
          echo "2b9aebe9de1b9f3dc6b2d2cb9d1c96ee4fa1945ef88312377097fdc565abf049  docs/dist/public/adapter/index.html" | sha256sum --check
      - name: Verify Chrome from GitHub-hosted runner
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Smoke test editor and actual preview
        run: |
          (cd docs && PORT=4173 pnpm start >/tmp/plumeria-official-server.log 2>&1) &
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({headless:true,channel:'chrome',args:['--no-sandbox']});
          const page = await browser.newPage({viewport:{width:1280,height:850}});
          page.on('console',msg=>{if(msg.type()==='error') console.error('browser:',msg.text());});
          let loaded=false;
          for (let attempt=0;attempt<30;attempt++){
            try {const response=await page.goto('http://127.0.0.1:4173/playground',{waitUntil:'domcontentloaded',timeout:8000});if(response?.ok()){loaded=true;break;}}
            catch{}
            await page.waitForTimeout(1000);
          }
          if(!loaded) throw new Error('site cannot serve /playground');
          await page.locator('[data-playground="stage"][data-ready="true"]').waitFor({timeout:120000});
          const stage=await page.locator('[data-playground="stage"]').getAttribute('data-ready');
          const preview=page.frameLocator('iframe[title="Preview"]');
          await preview.locator('body').waitFor({timeout:20000});
          const text=(await preview.locator('body').innerText()).trim();
          console.log(JSON.stringify({stage,previewCharacters:text.length,previewStart:text.slice(0,200)}));
          if(!text || /Export a component|cannot find|unsupported/i.test(text))throw new Error('preview did not render sample');
          if(!text.includes('Plumeria'))throw new Error('initial official sample missing');
          const editedSource = [
            "import * as css from '@plumeria/core';",
            'const styles = css.create({',
            "  testButton: { backgroundColor: '#6d28d9', color: '#ffffff', borderRadius: 12, paddingInline: 28, paddingBlock: 12 },",
            '});',
            'export default function App() {',
            '  return <button sx={styles.testButton}>編集済み</button>;',
            '}',
          ].join('\n');
          const editor=page.locator('.monaco-editor').first();
          await editor.waitFor({timeout:30000});
          await editor.click({position:{x:180,y:95}});
          await page.keyboard.press('Control+A');
          await page.keyboard.insertText(editedSource);
          await preview.getByRole('button',{name:'編集済み'}).waitFor({timeout:60000});
          const compiledColor=await preview.getByRole('button',{name:'編集済み'}).evaluate(element=>getComputedStyle(element).backgroundColor);
          if(compiledColor!=='rgb(109, 40, 217)')throw new Error('compiled purple background incorrect: '+compiledColor);
          console.log('OFFICIAL_PLAYGROUND_EDIT_EVIDENCE '+JSON.stringify({initialPreviewCharacters:text.length,changedButton:'編集済み',compiledColor,editedSourceChars:editedSource.length}));
          await page.screenshot({path:'plumeria-official-playground-smoke.png'});

          const adapter=await browser.newPage({viewport:{width:1180,height:800}});
          adapter.on('console',msg=>{if(msg.type()==='error')console.error('adapter-browser:',msg.text())});
          const adapterResponse=await adapter.goto('http://127.0.0.1:4173/adapter',{waitUntil:'domcontentloaded',timeout:15000});
          if(!adapterResponse?.ok())throw new Error('Node adapter page response failed');
          await adapter.locator('#compile:not([disabled])').waitFor({timeout:60000});
          const adapterPreview=adapter.frameLocator('iframe[title="Plumeriaプレビュー"]');
          await adapterPreview.getByRole('button',{name:'追加する'}).waitFor({timeout:60000});
          const firstColor=await adapterPreview.getByRole('button',{name:'追加する'}).evaluate(el=>getComputedStyle(el).backgroundColor);
          if(firstColor!=='rgb(22, 101, 52)')throw new Error('Node adapter initial color incorrect: '+firstColor);
          const adapterEdited=[
            "import * as css from '@plumeria/core';",
            "const styles = css.create({ addButton: { paddingInline: 28, paddingBlock: 12, color: '#ffffff', backgroundColor: '#6d28d9', borderRadius: 12 } });",
            'export default function App(){return <button sx={styles.addButton}>保存する</button>;}',
          ].join('\n');
          await adapter.locator('#source').fill(adapterEdited);
          await adapter.getByRole('button',{name:'コンパイルして表示'}).click();
          await adapterPreview.getByRole('button',{name:'保存する'}).waitFor({timeout:60000});
          const changedColor=await adapterPreview.getByRole('button',{name:'保存する'}).evaluate(el=>getComputedStyle(el).backgroundColor);
          if(changedColor!=='rgb(109, 40, 217)')throw new Error('Node adapter edited CSS incorrect: '+changedColor);
          await adapter.getByRole('button',{name:'初期化'}).click();
          await adapterPreview.getByRole('button',{name:'追加する'}).waitFor({timeout:60000});
          console.log('NODE_ADAPTER_EDIT_EVIDENCE '+JSON.stringify({firstColor,changedColor,labelAfterEdit:'保存する',resetLabel:'追加する'}));
          await adapter.screenshot({path:'plumeria-adapter-edited.png'});
          await browser.close();
          JS
      - name: Upload official browser compiler and preview files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plumeria-official-22-playground-build
          path: |
            docs/public/playground/
            docs/dist/public/
            plumeria-official-playground-smoke.png
            plumeria-adapter-edited.png
          if-no-files-found: warn
          retention-days: 2
